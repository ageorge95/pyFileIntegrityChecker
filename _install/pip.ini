# VERSION=1
# https://github.com/ageorge95/ag95_repo_base
# Package index configuration for this repository.
#
# install/update scripts:
#   - copy this file into the virtual environment (venv\pip.ini on Windows,
#     venv/pip.conf on Linux), so plain 'pip' inside the venv uses it
#   - pass index-url, extra-index-url and trusted-host to uv, which installs
#     the requirements
#
# To add package servers, uncomment the examples below and keep the URLs
# indented (one per line). When extra indexes are present, the best matching
# version across all indexes is installed.

[global]
index-url = https://pypi.org/simple

# extra-index-url =
#     https://my.artifactory.example.com/artifactory/api/pypi/my_repo/simple
#     http://my-server.example.com:8080/simple

[install]
# Hosts served over plain http or with self-signed certificates:
# trusted-host =
#     my.artifactory.example.com
#     my-server.example.com
